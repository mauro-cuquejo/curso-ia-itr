<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#4052C4" />
  <meta name="description"
    content="ITR Dashboard - Sistema de gestión de usuarios con autenticación y panel administrativo" />
  <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

  <!-- Fuentes de Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Montserrat para branding ITR (aprox. por imagen de referencia) -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Iconos de Material UI -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">

  <title>ITR Dashboard</title>

  <style>
    /* Loading inicial */
    #root {
      min-height: 100vh;
    }

    .initial-loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #4052C4 0%, #8036DA 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .loader-content {
      text-align: center;
      color: white;
    }

    .loader-spinner {
      width: 50px;
      height: 50px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top: 3px solid white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    .loader-text {
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 18px;
      font-weight: 500;
      margin: 0;
    }

    .loader-subtext {
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 14px;
      font-weight: 400;
      margin: 8px 0 0 0;
      opacity: 0.8;
    }
  </style>
</head>

<body>
  <noscript>
    <div style="text-align: center; padding: 50px; font-family: Arial, sans-serif;">
      <h2>JavaScript Requerido</h2>
      <p>Esta aplicación requiere JavaScript para funcionar correctamente.</p>
      <p>Por favor, habilita JavaScript en tu navegador y recarga la página.</p>
    </div>
  </noscript>

  <!-- Loading inicial mientras carga React -->
  <div id="initial-loader" class="initial-loader">
    <div class="loader-content">
      <div class="loader-spinner"></div>
      <h2 class="loader-text">ITR Dashboard</h2>
      <p class="loader-subtext">Cargando aplicación...</p>
    </div>
  </div>

  <div id="root"></div>

  <script>
    // Remover loader inicial cuando React esté listo
    window.addEventListener('DOMContentLoaded', function () {
      setTimeout(function () {
        const loader = document.getElementById('initial-loader');
        if (loader && window.React) {
          loader.style.opacity = '0';
          setTimeout(function () {
            loader.remove();
          }, 300);
        }
      }, 100);
    });
  </script>
</body>

</html>
